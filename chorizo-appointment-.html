<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mexican Chorizo appointment Scheduler</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#176B87;
  --primary-2:#0E4F66;
  --accent:#64CCC5;
  --accent-soft:#E8F7F6;
  --bg:#F3F7FA;
  --surface:#FFFFFF;
  --surface-2:#F8FBFC;
  --text:#17212B;
  --muted:#64748B;
  --hint:#8EA0AF;
  --border:#D8E3EA;
  --danger:#B42318;
  --shadow:0 18px 45px rgba(23,107,135,.14);
  --r:22px;
  --rs:13px;
}
body{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at top left, rgba(100,204,197,.22), transparent 34rem),
    linear-gradient(135deg,#F7FBFD 0%,#EEF5F8 100%);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem 1rem;
}
.wrap{
  width:100%;
  max-width:460px;
}
.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:1rem;
}
.brand-left{
  display:flex;
  align-items:center;
  gap:.75rem;
}
.logo{
  width:42px;
  height:42px;
  border-radius:14px;
  background:linear-gradient(145deg,var(--primary),var(--accent));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:22px;
  box-shadow:0 12px 25px rgba(23,107,135,.22);
}
.brand h1{
  font-size:15px;
  font-weight:700;
  line-height:1.1;
  color:var(--primary-2);
}
.brand p{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}
.badge{
  font-size:11px;
  font-weight:700;
  color:var(--primary-2);
  background:var(--accent-soft);
  border:1px solid rgba(100,204,197,.45);
  border-radius:999px;
  padding:7px 10px;
}
.prog-wrap{
  background:rgba(255,255,255,.68);
  border:1px solid rgba(216,227,234,.75);
  border-radius:16px;
  padding:10px 12px;
  margin-bottom:1rem;
  backdrop-filter:blur(10px);
}
.prog-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.prog-title{
  font-size:11px;
  color:var(--muted);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.prog-lbl{
  font-size:11px;
  color:var(--hint);
  font-weight:600;
}
.prog-track{
  height:7px;
  background:#E5EEF3;
  border-radius:99px;
  overflow:hidden;
}
.prog-fill{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:99px;
  transition:width .35s cubic-bezier(.4,0,.2,1);
}
.card{
  background:var(--surface);
  border:1px solid rgba(216,227,234,.92);
  border-radius:var(--r);
  padding:1.4rem;
  box-shadow:var(--shadow);
  animation:fadeUp .28s cubic-bezier(.4,0,.2,1) both;
  overflow:hidden;
  position:relative;
}
.card:before{
  content:'';
  position:absolute;
  inset:0 0 auto 0;
  height:5px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.step-head{
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin-top:.35rem;
  margin-bottom:1.25rem;
}
.step-emoji{
  width:42px;
  height:42px;
  border-radius:14px;
  background:var(--accent-soft);
  color:var(--primary-2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  border:1px solid rgba(100,204,197,.35);
  flex-shrink:0;
}
.step-q{
  font-family:'Source Serif 4',serif;
  font-size:24px;
  font-weight:600;
  line-height:1.12;
  color:var(--text);
}
.step-q em{
  font-style:normal;
  color:var(--primary);
}
.step-hint{
  font-size:12.5px;
  color:var(--muted);
  line-height:1.45;
  margin-top:6px;
}
.field-label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--primary-2);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:8px;
}
.field-label span:last-child{
  color:var(--hint);
  font-weight:600;
  text-transform:none;
  letter-spacing:0;
}
.finput{
  width:100%;
  height:50px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:var(--rs);
  background:var(--surface-2);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:15px;
  outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.finput:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(23,107,135,.1);
  background:#fff;
}
.opts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.pill{
  padding:13px 11px;
  border:1px solid var(--border);
  border-radius:var(--rs);
  background:var(--surface-2);
  cursor:pointer;
  font-size:13px;
  color:var(--muted);
  text-align:left;
  line-height:1.32;
  transition:all .14s;
  user-select:none;
  min-height:48px;
  display:flex;
  align-items:center;
}
.pill:hover{
  border-color:var(--primary);
  color:var(--primary-2);
  background:#fff;
  transform:translateY(-1px);
}
.pill.on{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--primary-2);
  font-weight:700;
  box-shadow:0 8px 18px rgba(100,204,197,.18);
}
.nav{
  display:flex;
  gap:10px;
  margin-top:1.35rem;
}
.btn-next{
  flex:1;
  height:48px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;
  border:none;
  border-radius:var(--rs);
  font-family:'Inter',sans-serif;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:opacity .15s,transform .1s,box-shadow .15s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  box-shadow:0 10px 20px rgba(23,107,135,.22);
}
.btn-next:hover{
  opacity:.95;
  box-shadow:0 12px 24px rgba(23,107,135,.28);
}
.btn-next:active{transform:scale(.985)}
.btn-back{
  height:48px;
  width:48px;
  flex-shrink:0;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--rs);
  font-size:18px;
  cursor:pointer;
  color:var(--primary-2);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .15s,border-color .15s;
}
.btn-back:hover{
  background:var(--surface-2);
  border-color:var(--primary);
}
.err{
  font-size:12px;
  color:var(--danger);
  margin-top:8px;
  min-height:16px;
}
.notice-box{
  background:#F0FAFB;
  border:1px solid rgba(23,107,135,.18);
  border-left:4px solid var(--primary);
  border-radius:var(--rs);
  padding:1rem;
  font-size:14px;
  color:var(--primary-2);
  line-height:1.45;
  margin-bottom:1rem;
}
.notice-box strong{
  display:block;
  margin-bottom:4px;
}
.summary-card{
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  background:#fff;
}
.sum-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:12px 13px;
  border-bottom:1px solid #EDF3F6;
  font-size:13px;
  gap:14px;
}
.sum-row:last-child{border-bottom:none}
.sum-row .k{
  color:var(--muted);
  flex-shrink:0;
  font-weight:600;
}
.sum-row .v{
  font-weight:700;
  color:var(--text);
  text-align:right;
}
.success{
  text-align:center;
  animation:fadeUp .35s ease both;
  background:#fff;
  border:1px solid rgba(216,227,234,.92);
  border-radius:var(--r);
  padding:2rem 1.4rem;
  box-shadow:var(--shadow);
}
.big-e{
  width:66px;
  height:66px;
  margin:0 auto 1rem;
  border-radius:22px;
  background:linear-gradient(145deg,var(--primary),var(--accent));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  animation:bounce .65s ease both;
}
@keyframes bounce{
  0%{transform:scale(.65);opacity:0}
  65%{transform:scale(1.08)}
  100%{transform:scale(1);opacity:1}
}
.success h2{
  font-family:'Source Serif 4',serif;
  font-size:27px;
  font-weight:600;
  margin-bottom:8px;
  color:var(--primary-2);
}
.success p{
  font-size:14px;
  color:var(--muted);
  line-height:1.7;
}
.btn-restart{
  font-size:13px;
  color:var(--primary-2);
  background:var(--accent-soft);
  border:1px solid rgba(100,204,197,.55);
  border-radius:var(--rs);
  padding:10px 22px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  font-weight:700;
  transition:background .15s,transform .1s;
  margin-top:1.5rem;
  display:inline-block;
}
.btn-restart:hover{background:#DDF3F1}
.btn-restart:active{transform:scale(.98)}
@media (max-width:390px){
  .opts{grid-template-columns:1fr}
  .brand{align-items:flex-start}
  .badge{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-left">
      <div class="logo">+</div>
      <div>
        <h1>Mexican Chorizo appointment Scheduler</h1>
        <p>Confidential planning form</p>
      </div>
    </div>
    <div class="badge">Secure Intake</div>
  </div>

  <div class="prog-wrap" id="prog-wrap">
    <div class="prog-top">
      <div class="prog-title">Appointment Intake</div>
      <div class="prog-lbl" id="prog-lbl"></div>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>

  <div id="stage"></div>
</div>

<script>
const MY_WHATSAPP = '19567895660';

const ans = {};
let cur = 0;

const steps = [
  {
    id: 'name', emoji: '👤',
    q: 'Guest <em>name</em>',
    hint: 'Enter the name for this Mexican Chorizo appointment.',
    type: 'text', ph: 'Type your name...'
  },
  {
    id: 'date', emoji: '📅',
    q: 'Appointment <em>date</em>',
    hint: 'Choose the date that works best.',
    type: 'date'
  },
  {
    id: 'time', emoji: '🕒',
    q: 'Preferred <em>time window</em>',
    hint: 'Select an approximate appointment window.',
    type: 'opts',
    opts: ['Morning (7–10 AM)', 'Midday (11 AM–1 PM)', 'Afternoon (2–5 PM)', 'Evening (6–9 PM)', 'Late night (10 PM+)', 'Flexible']
  },
  {
    id: 'vibe', emoji: '📝',
    q: 'Appointment <em>type</em>',
    hint: 'Select the preferred Mexican Chorizo appointment type.',
    type: 'opts',
    opts: ['Making Love', 'Passionate & Savage', 'BDSM', 'Blindfold Play', 'Whatever you want', 'Roleplay']
  },
  {
    id: 'location', emoji: '📍',
    q: 'Appointment <em>room</em>',
    hint: 'Choose the preferred location.',
    type: 'opts',
    opts: ['My bed', 'Your bed', 'The couch', 'Shower', 'The car', 'Surprise location']
  },
  {
    id: 'confirm', emoji: '✅',
    q: 'Review <em>appointment</em>',
    type: 'confirm'
  }
];

const TOTAL = steps.length;

function prog(i) {
  document.getElementById('prog-fill').style.width = Math.round(i / TOTAL * 100) + '%';
  document.getElementById('prog-lbl').textContent = i + ' of ' + TOTAL;
}

function render(i) {
  prog(i);
  const s = steps[i];
  let body = '';

  if (s.type === 'confirm') {
    const fmt = new Date(ans.date + 'T12:00:00').toLocaleDateString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
    });
    const rows = [
      ['Guest', ans.name],
      ['Date', fmt],
      ['Time', ans.time],
      ['Type', ans.vibe],
      ['Room', ans.location]
    ];
    body = `
      <div class="step-head">
        <div class="step-emoji">${s.emoji}</div>
        <div>
          <div class="step-q">${s.q}</div>
          <div class="step-hint">Please verify the appointment details before opening WhatsApp.</div>
        </div>
      </div>
      <div class="notice-box">
        <strong>Private note</strong>
        Miss you so much, your Mexican boyfriend 💕
      </div>
      <div class="summary-card" style="margin-bottom:1.1rem">${rows.map(([k,v]) => `<div class="sum-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>
      <div class="err" id="err"></div>
      <div class="nav">
        <button class="btn-back" onclick="goBack()">&#8592;</button>
        <button class="btn-next" onclick="finish()">Open WhatsApp</button>
      </div>`;
  } else {
    let field = '';
    if (s.type === 'text') {
      field = `
        <div class="field-label"><span>Required field</span><span>Text entry</span></div>
        <input class="finput" id="fi" type="text" placeholder="${s.ph}" value="${ans[s.id] || ''}" />`;
    } else if (s.type === 'date') {
      const today = new Date().toISOString().split('T')[0];
      field = `
        <div class="field-label"><span>Required field</span><span>Date</span></div>
        <input class="finput" id="fi" type="date" min="${today}" value="${ans[s.id] || ''}" />`;
    } else if (s.type === 'opts') {
      field = `
        <div class="field-label"><span>Required field</span><span>Select one</span></div>
        <div class="opts">${s.opts.map(o => `<div class="pill${ans[s.id] === o ? ' on' : ''}" data-v="${o}" onclick="pick(this)">${o}</div>`).join('')}</div>`;
    }
    body = `
      <div class="step-head">
        <div class="step-emoji">${s.emoji}</div>
        <div>
          <div class="step-q">${s.q}</div>
          ${s.hint ? `<div class="step-hint">${s.hint}</div>` : ''}
        </div>
      </div>
      ${field}
      <div class="err" id="err"></div>
      <div class="nav">
        ${i > 0 ? `<button class="btn-back" onclick="goBack()">&#8592;</button>` : ''}
        <button class="btn-next" onclick="next()">${i === TOTAL - 2 ? 'Review Appointment' : 'Continue'} &rarr;</button>
      </div>`;
  }

  document.getElementById('stage').innerHTML = `<div class="card">${body}</div>`;
  const fi = document.getElementById('fi');
  if (fi && s.type === 'text') setTimeout(() => fi.focus(), 50);
  if (fi && s.type !== 'date') fi.addEventListener('keydown', e => { if (e.key === 'Enter') next(); });
}

function pick(el) {
  el.closest('.opts').querySelectorAll('.pill').forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  ans[steps[cur].id] = el.dataset.v;
}

function showErr(m) { const e = document.getElementById('err'); if (e) e.textContent = m; }

function next() {
  const s = steps[cur];
  if (s.type === 'text' || s.type === 'date') {
    const v = (document.getElementById('fi').value || '').trim();
    if (!v) { showErr('Please complete this required field.'); return; }
    ans[s.id] = v;
  } else if (s.type === 'opts') {
    if (!ans[s.id]) { showErr('Please select one option to continue.'); return; }
  }
  cur++;
  render(cur);
}

function goBack() { if (cur > 0) { cur--; render(cur); } }

function finish() {
  const fmt = new Date(ans.date + 'T12:00:00').toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });

  const msg =
`🗓️ *Mexican Chorizo appointment Request from ${ans.name}*

Appointment intake completed.

👤 *Guest:* ${ans.name}
📅 *Date:* ${fmt}
🕒 *Time:* ${ans.time}
📝 *Type:* ${ans.vibe}
📍 *Room:* ${ans.location}

_"Miss you so much, your Mexican boyfriend 💕"_`;

  const waUrl = 'https://wa.me/' + MY_WHATSAPP + '?text=' + encodeURIComponent(msg);

  document.getElementById('prog-wrap').style.display = 'none';
  document.getElementById('stage').innerHTML = `
    <div class="success">
      <span class="big-e">✓</span>
      <h2>Appointment ready, ${ans.name}.</h2>
      <p>WhatsApp is opening with the completed appointment request.<br>Please review it there before sending.</p>
      <button class="btn-restart" onclick="restart()">Start over</button>
    </div>`;

  setTimeout(() => { window.open(waUrl, '_blank'); }, 600);
}

function restart() {
  Object.keys(ans).forEach(k => delete ans[k]);
  cur = 0;
  document.getElementById('prog-wrap').style.display = 'block';
  render(0);
}

render(0);
</script>
</body>
</html>
